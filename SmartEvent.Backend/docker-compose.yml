services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: smartevent-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  smartevent.api:
    image: smartevent-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AuthSettings__SecretKey=${JWT_KEY}
      - AuthSettings__Expires=${JWT_EXPIRES}
    depends_on:
      - rabbitmq

volumes:
  mongo_data:
  rabbitmq_data: